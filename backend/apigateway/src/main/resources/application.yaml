      discovery:
        locator:
          enabled: true 
          lower-case-service-id: true 

# ==================== ĐOẠN SỬA ĐỔI CHO GATEWAY ====================
springdoc:
  enable-native-support: true
  swagger-ui:
    # Sắp xếp các danh mục dịch vụ theo bảng chữ cái cho đẹp mắt
    operationsSorter: alpha
    tagsSorter: alpha
  gateway:
    discovered-microservices:
      enabled: false
      # Loại bỏ các service nội bộ của Spring Cloud nếu không cần show API
      ignored-services: api-gateway, discovery-server 
# ===================================================================
# ===================================================================

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyThatIsAtLeast32CharactersLong!}
logging:
  level:
    org.springframework.cloud.gateway.filter.ratelimit: DEBUG
    org.springframework.data.redis: DEBUG

