server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis} # Tên container trong docker-compose
      port: ${REDIS_PORT:6379}
  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/userservice/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/authservice/**
          filters:
            - name: RequestRateLimiter
              args:
                # KeyResolver bean dùng để xác định giới hạn theo IP
                key-resolver: "#{@ipKeyResolver}"
                # Số lượng token được thêm vào mỗi giây (1/10 = 0.1)
                redis-rate-limiter.replenishRate: 1
                # Số lượng request tối đa trong "Burst" (để đạt đúng 1 req/10s)
                redis-rate-limiter.burstCapacity: 1
                redis-rate-limiter.requestedTokens: 1
        - id: movie-service
          uri: lb://movie-service
          predicates:
