spring.application.name=auth-service

# Cấu hình kết nối PostgreSQL
# Thêm namespace vào sau tên service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db12345}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Cấu hình JPA/Hibernate cho PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Các cấu hình khác giữ nguyên
server.port=8082
server.servlet.context-path=/authservice
jwt.secret=${JWT_SECRET:MySuperSecretKeyThatIsAtLeast32CharactersLong!}