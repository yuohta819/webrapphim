spring.application.name=user-service

# Cấu hình kết nối PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/userdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:db12345}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Cấu hình JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Các cấu hình khác
server.port=8081
server.servlet.context-path=/userservice
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=DEBUG
jwt.secret=${JWT_SECRET:MySuperSecretKeyThatIsAtLeast32CharactersLong!}