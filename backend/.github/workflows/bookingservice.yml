name: Booking Service CI/CD
on:
  push:
    branches: [ "main" ]
    paths:
      - 'bookingservice/**'
      - 'commonservice/**'
      - '.github/workflows/bookingservice.yml'

jobs:
  call-template:
    uses: ./.github/workflows/service-template.yml
    with:
      service_name: 'bookingservice'
    secrets: inherit # Tự động lấy các secrets trong repo