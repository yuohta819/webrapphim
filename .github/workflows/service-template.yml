name: Service CI/CD Template
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Shared Libraries
        shell: cmd
        run: |
          cd commonservice/commonservice && mvn clean install -DskipTests && cd ../..
          cd commonevent/commonevent && mvn clean install -DskipTests && cd ../..
          cd keycloakservice/keycloakservice && mvn clean install -DskipTests && cd ../..

      - name: Build Service
        shell: cmd
        run: cd ${{ inputs.service_name }}/${{ inputs.service_name }} && mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ inputs.service_name }}/${{ inputs.service_name }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest

      - name: Reload K8s Code
        shell: cmd
        run: kubectl rollout restart deployment ${{ inputs.service_name }} -n webhomestay