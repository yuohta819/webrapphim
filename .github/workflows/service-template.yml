name: Service CI/CD Template
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      folder_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Shared Libraries
        shell: cmd
        # Thêm backend/ vào trước
        run: cd backend/commonservice && mvn clean install -DskipTests

      - name: Build Service
        shell: cmd
        # Kiểm tra kỹ: có phải là backend/service_name/service_name không?
        run: cd backend/${{ inputs.folder_name}} && mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          # Cập nhật đường dẫn context
          context: .
          file: ./backend/${{ inputs.folder_name }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.service_name }}:latest

      - name: Reload K8s Code
        shell: cmd
        # Sửa tên namespace thành webrapphim
        run: kubectl rollout restart deployment ${{ inputs.service_name }} -n webrapphim